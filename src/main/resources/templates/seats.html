<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>좌석 선택 - 기차 예매</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: header('좌석 선택')}"></div>

<main class="container">
    <div class="summary-card">
        <div><strong th:text="${trip.trainNo}"></strong>호 열차</div>
        <div th:text="${fromStationName} + ' → ' + ${toStationName}"></div>
        <div th:text="${#temporals.format(trip.departureTime, 'yyyy-MM-dd HH:mm')} + ' 출발'"></div>
    </div>

    <p th:if="${errorMessage}" class="error" th:text="${errorMessage}"></p>

    <div class="seat-grid">
        <a class="seat" th:each="seat : ${seats}"
           th:href="@{/web/bookings/new(tripId=${trip.tripId}, seatId=${seat.seatId})}"
           th:text="${seat.seatNo} + '번'"></a>
    </div>

    <p th:if="${#lists.isEmpty(seats)}" class="empty">예약 가능한 좌석이 없습니다.</p>

    <a class="link-back" th:href="@{/web/trips}">← 열차 목록으로</a>
</main>
</body>
</html>
