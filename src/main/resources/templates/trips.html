<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>열차 조회 - 기차 예매</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: header('열차 조회')}"></div>

<main class="container">
    <form class="search-form" method="get" th:action="@{/web/trips}">
        <select name="fromStationId">
            <option value="">출발역 전체</option>
            <option th:each="s : ${stations}" th:value="${s.stationId}" th:text="${s.stationName}"
                    th:selected="${fromStationId != null and s.stationId.equals(fromStationId)}"></option>
        </select>
        <select name="toStationId">
            <option value="">도착역 전체</option>
            <option th:each="s : ${stations}" th:value="${s.stationId}" th:text="${s.stationName}"
                    th:selected="${toStationId != null and s.stationId.equals(toStationId)}"></option>
        </select>
        <button type="submit">조회</button>
    </form>

    <table class="trip-table">
        <thead>
        <tr>
            <th>열차번호</th>
            <th>출발역</th>
            <th>도착역</th>
            <th>출발시각</th>
            <th>도착시각</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="trip : ${trips}">
            <td th:text="${trip.trainNo}"></td>
            <td th:text="${trip.fromStationName}"></td>
            <td th:text="${trip.toStationName}"></td>
            <td th:text="${#temporals.format(trip.departureTime, 'MM-dd HH:mm')}"></td>
            <td th:text="${#temporals.format(trip.arrivalTime, 'MM-dd HH:mm')}"></td>
            <td><a class="btn" th:href="@{/web/trips/{id}/seats(id=${trip.tripId})}">좌석 보기</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(trips)}">
            <td colspan="6" class="empty">조회된 열차가 없습니다.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
