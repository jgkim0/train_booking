# Gradle(gradlew) 자체를 실행할 JDK를 명시적으로 지정합니다.
# 시스템 JAVA_HOME이 무효(끝에 \bin이 붙어있음)하거나, 다른 프로젝트와 다른
# JDK 버전을 요구할 때를 대비해 이 프로젝트에서만 적용되도록 설정했습니다.
# Gradle 9.x는 데몬 실행에 JDK 17 이상을 요구합니다. (참고: 컴파일에 쓰이는
# JDK 21 toolchain은 build.gradle의 java.toolchain 설정을 따로 따릅니다.)
org.gradle.java.home=C:/Program Files/Java/jdk-17
